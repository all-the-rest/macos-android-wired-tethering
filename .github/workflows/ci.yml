name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace --all-targets
      - name: validate requirement matrix
        run: |
          python3 - <<'PY'
          import json
          requirements = json.load(open("docs/requirements.json", encoding="utf-8"))["requirements"]
          ids = {requirement["id"] for requirement in requirements}
          expected = {f"F-{index:02d}" for index in range(1, 10)} | {
              f"N-{index:02d}" for index in range(1, 7)
          }
          missing = expected - ids
          if missing:
              raise SystemExit(f"requirements matrix misses: {sorted(missing)}")
          print(f"requirements matrix covers {len(expected)} F/N IDs")
          PY
      - name: arm64 build
        run: cargo build --release --target aarch64-apple-darwin --workspace
      - name: verify artifact architecture
        run: |
          file target/aarch64-apple-darwin/release/android-tether
          file target/aarch64-apple-darwin/release/android-tether-helper

  coverage:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: coverage
        run: |
          mkdir -p target/g1
          cargo llvm-cov --workspace --json --summary-only \
            --output-path target/g1/coverage.json
          python3 - <<'PY'
          import json
          totals = json.load(open("target/g1/coverage.json", encoding="utf-8"))["data"][0]["totals"]
          lines = totals["lines"]
          print(f"lines: {lines['covered']}/{lines['count']} ({lines['percent']:.2f}%)")
          if lines["percent"] < 50.0:
              raise SystemExit("line coverage fell below 50%")
          PY
      - name: upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: g1-coverage
          path: target/g1/coverage.json

  fuzz:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: build fuzz targets
        run: cd fuzz && cargo fuzz build
      - name: run descriptors
        run: cd fuzz && cargo fuzz run descriptors -- -max_total_time=15 -print_final_stats=1
      - name: run rndis
        run: cd fuzz && cargo fuzz run rndis -- -max_total_time=15 -print_final_stats=1
      - name: run ethernet
        run: cd fuzz && cargo fuzz run ethernet -- -max_total_time=15 -print_final_stats=1

  macos-smoke:
    # The runner needs passwordless sudo and a usable feth/BPF stack.  This job
    # is allowed to fail on hosted runners that do not expose feth; the
    # protocol-core verification job above is the required gate.
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: privileged feth/BPF/network-service smoke
        run: ./scripts/macos-smoke.sh
      - name: upload net-smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-net-smoke
          path: target/g1/net-smoke.json
