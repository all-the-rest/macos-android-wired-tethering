[workspace]
resolver = "2"
members = [
    "crates/tether-core",
    "crates/tether-macos",
    "crates/tether-usb",
    "crates/tether-cli",
    "crates/tether-helper",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Android USB Tethering contributors"]
repository = "https://example.invalid/android-usb-tethering"

[workspace.dependencies]
thiserror = "2"
libc = "0.2"
rusb = { version = "0.9", features = ["vendored"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
